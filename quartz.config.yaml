# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Department-edition Quartz v5 configuration — textbook platform (Scenario B).
# Coordinators: you only ever edit the four lines marked "← EDIT".
# Everything else is theme + behaviour shared across all editions.
# Full plugin list mirrors quartz.config.default.yaml (v5.0.0); deviations are commented.

configuration:
  pageTitle: "EDITION TITLE" # ← EDIT (guide step 3a) e.g. "Biology Edition — <Textbook Title>"
  pageTitleSuffix: " - Department Edition"
  # DO NOT set this to true. Quartz's SPA navigation destroys the Hypothes.is
  # client irrecoverably: micromorph deletes <hypothesis-sidebar> from the body
  # on every navigation, and re-booting embed.js into the already-swapped body
  # does not produce a working sidebar. Tagging head elements with data-persist
  # kept the boot marker alive but was insufficient — and head elements then
  # accumulated on each nav. Four rounds of debugging established this.
  # Editions therefore trade slightly slower navigation (full page loads) for
  # reliable third-party annotation, which also matches how the canonical
  # Obsidian Publish site behaves.
  enableSPA: false
  enablePopovers: true
  # Built-in provider uses Plausible's legacy shared script; we inject the
  # per-site pa-*.js script via edition-integrations instead. Keep this null
  # or every view double-counts.
  analytics: null
  locale: en-US
  baseUrl: edition.example.org # ← EDIT (guide step 3b) your site address, no https://, no trailing slash
  ignorePatterns:
    - private
    - templates
    - .obsidian
  # Overridden by design.yaml (edition-integrations, BOOK-ONE-TO-QUARTZ §4a), the
  # same design as every platform book. Quartz still needs the block to build,
  # but its values never reach the page. Colours and fonts are changed in
  # quartz-edition-extras' plugins/edition-integrations/design.yaml, not here.
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # visual-direction-v1: sans throughout, Inter + JetBrains Mono
      header: Inter
      body: Inter
      code: JetBrains Mono
    colors:
      # Mapping per visual-direction-v1.md "Quartz colors.lightMode" line —
      # same family as publish.css v1 on the canonical site.
      lightMode:
        light: "#FFFFFF" # page background
        lightgray: "#E6E6E6" # borders / dividers
        gray: "#9B9BA1" # faint / placeholders
        darkgray: "#2B2B2B" # body text
        dark: "#2B2B2B" # headings, icons
        secondary: "#7C6CF0" # primary accent — links, active nav
        tertiary: "#6A57E0" # accent hover (AA on white)
        highlight: "#EEEBFD" # accent wash — internal-link tint
        textHighlight: "#FDF2B3" # ==mark== / Hypothes.is echo
      # Dark mode is disabled below (canonical is light-only; keeps the family
      # reading as one). Values kept sane in case Brandon wants it re-enabled.
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#D4D4D4"
        dark: "#EBEBEC"
        secondary: "#A79AF7"
        tertiary: "#8F7FF2"
        highlight: "rgba(124, 108, 240, 0.15)"
        textHighlight: "#b3aa0288"

plugins:
  - source: github:quartz-community/created-modified-date
    enabled: false
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      # matches Obsidian's "shortest path" link style used in the canonical vault
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  # The graph is on, as in every platform book (BOOK-ONE-TO-QUARTZ D11): the
  # platform's fork, textbook-graph, below with the other platform plugins.
  # textbook-registry's parity checks that its block matches the builder's.
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # Off, as on every platform book (quartz-book#49): the edition's title is in
  # edit-on-github's sticky header.
  - source: github:quartz-community/page-title
    enabled: false
    layout:
      position: left
      priority: 10
  # Stays OFF: the reader's one theme control is the header's Appearance panel
  # (Aa: Auto, Light, Dark), run by edition-integrations, on Quartz's own `theme`
  # key. Turning this on would give readers a second, conflicting toggle.
  - source: github:quartz-community/darkmode
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # Off, as on every platform book: the header carries the page's place.
  - source: github:quartz-community/breadcrumbs
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  # Stays disabled: reader discussion is Hypothes.is, not giscus.
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Canonical textbook: https://ontology-for-social-research-a-criti.confused4now.org
        Licence (CC-BY-SA-4.0): https://creativecommons.org/licenses/by-sa/4.0/
        Privacy: https://confused4now.org/privacy
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

  # ---------------------------------------------------------------------------
  # Edition customisations — live in their own repo (quartz-edition-extras),
  # never in Quartz core, so Quartz updates can't break them.
  # ---------------------------------------------------------------------------

  # Theme fine-tuning (18px/1.65 body, 720px measure, heading scale) +
  # Hypothes.is + Plausible script injection.
  - source:
      repo: "https://github.com/textbookproject2026-alt/quartz-edition-extras.git"
      subdir: plugins/edition-integrations
      name: edition-integrations
    enabled: true
    options:
      # ← EDIT (guide step 3c): paste your edition's own script address from
      # the Plausible dashboard (Site settings → Site installation). It looks
      # like https://plausible.io/js/pa-XXXXXXXXXX.js
      # Leave "" and analytics simply stays off — nothing breaks.
      plausibleScriptSrc: ""
      # No Hypothes.is public layer, as on the platform's books: until a class
      # group is set up, editions load no Hypothes.is at all, and Contribute
      # shows "Comment in the margin — coming soon for classes", greyed out.
      # hypothesisGroupId: a restricted Hypothes.is group (anyone reads, members
      # post) that turns margin comments on, in that group and the ones listed
      # in hypothesisGroups. Leave both empty until the platform says otherwise.
      publicAnnotations: false
      hypothesisGroupId: ""
      # Optional, with plausibleScriptSrc above: your site address (as
      # baseUrl). Plausible then counts only there, not on *.pages.dev
      # previews. Leave "" to count everywhere the site is served.
      siteDomain: ""
      # The platform's Privacy page: the first-visit privacy note (No tracking
      # cookies…, with Turn comments off and OK) links to it, as on every book.
      # "" leaves the note out.
      privacyUrl: "https://confused4now.org/privacy"
      # The reader tools every platform book has: the "Tag your annotation"
      # panel, the per-page annotation count, and paragraph numbers (¶) with a
      # reader's toggle. Set any to false to leave it out.
      tagHelper: true
      annotationBadge: true
      paragraphNumbers: true

  # The graph: quartz-community/graph with nodes coloured by topic (frontmatter
  # `topic:`, else the first tag), always-on labels and a topic legend.
  # Upstream's options; `concept` is a marker for concept pages, not a subject,
  # so it isn't drawn as a tag node (the portal skips it for the same reason).
  - source:
      repo: "https://github.com/textbookproject2026-alt/quartz-edition-extras.git"
      subdir: plugins/textbook-graph
      name: textbook-graph
    enabled: true
    # The local graph is spread wider than upstream's (linkDistance 30,
    # repelForce 0.5), with slightly smaller labels, so its always-on labels
    # have room in the 250px rail. Measured on book one's Chapter 3: about 6
    # of 9 labels fit at upstream's spacing, about 8.6 of 9 at this.
    options:
      localGraph:
        removeTags: [concept]
        linkDistance: 80
        repelForce: 1.2
        fontSize: 0.55
      globalGraph:
        removeTags: [concept]
    layout:
      position: right
      priority: 10

  # The sticky header on every page: the edition's title and the page's place,
  # Search, Contribute (Edit on GitHub ↗, Public comment, How contributing works;
  # an edition has no suggest endpoint, so no editor and no Note to the authors),
  # Annotate, Appearance (Aa) and ⋯ (Cite, Print, Page history, What links here,
  # Download, View source).
  - source:
      repo: "https://github.com/textbookproject2026-alt/quartz-edition-extras.git"
      subdir: plugins/edit-on-github
      name: edit-on-github
    enabled: true
    options:
      repo: "OWNER/REPO" # ← EDIT (guide step 3d) your edition's repo, e.g. biology-dept/textbook-biology-edition
      branch: main
      licence: CC-BY-SA-4.0 # the canonical textbook's licence, for Cite this page
    layout:
      position: beforeBody
      priority: 1 # first, above the page's title

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    # The "book" frame (quartz-edition-extras' edit-on-github) draws the page
    # header in the grid's header row, so it sticks against the whole page.
    content:
      template: book
    folder:
      template: book
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      template: book
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
